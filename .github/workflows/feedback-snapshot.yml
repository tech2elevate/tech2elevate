name: Refresh feedback results

# Pulls each year's survey responses from its published Google Sheet CSV and
# commits the snapshot (data/feedback/<year>.json). The deploy workflow then
# publishes /feedback/<year>/results. Runs Mondays and on demand.
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: node scripts/feedback-snapshot.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/feedback; then
            echo "No new responses."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feedback
          git commit -m "Feedback: refresh survey snapshot"
          git push
